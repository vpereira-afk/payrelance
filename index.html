<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayRelance — Plateforme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#F1F5F9; --text:#0F172A; --muted:#5B6B83; --dim:#94A3B8;
  --line:#E2E8F0; --line-strong:#CBD5E1;
  --brand:#1E3A8A; --brand-btn:#1E3A8A; --brand-hover:#17306F; --brand-soft:#E8EEFC;
  --green:#10B981; --green-btn:#0EA371; --green-soft:#E3F7EE; --green-ink:#047857;
  --coral:#F43F5E; --coral-soft:#FFE8EC; --coral-ink:#BE123C;
  --amber-soft:#FEF3C7; --amber-ink:#92400E;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -14px rgba(15,23,42,.14);
  --font-d:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A101E; --surface:#111A2D; --surface-2:#16213A; --text:#E8EDF8; --muted:#97A5C2; --dim:#6B7A99;
    --line:#1F2B45; --line-strong:#2C3B5E;
    --brand:#8FA9F7; --brand-btn:#4A6EE0; --brand-hover:#5B7FEE; --brand-soft:rgba(91,127,238,.16);
    --green:#34D399; --green-btn:#10B981; --green-soft:rgba(16,185,129,.16); --green-ink:#34D399;
    --coral:#FB7185; --coral-soft:rgba(244,63,94,.16); --coral-ink:#FB7185;
    --amber-soft:rgba(245,158,11,.16); --amber-ink:#FBBF24;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A101E; --surface:#111A2D; --surface-2:#16213A; --text:#E8EDF8; --muted:#97A5C2; --dim:#6B7A99;
  --line:#1F2B45; --line-strong:#2C3B5E;
  --brand:#8FA9F7; --brand-btn:#4A6EE0; --brand-hover:#5B7FEE; --brand-soft:rgba(91,127,238,.16);
  --green:#34D399; --green-btn:#10B981; --green-soft:rgba(16,185,129,.16); --green-ink:#34D399;
  --coral:#FB7185; --coral-soft:rgba(244,63,94,.16); --coral-ink:#FB7185;
  --amber-soft:rgba(245,158,11,.16); --amber-ink:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.5);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
*{ margin:0; padding:0; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-b); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
body.noscroll{ overflow:hidden; }
button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:none; background:none; }
input,select,textarea{ font-family:inherit; font-size:inherit; color:var(--text); }
a{ color:inherit; }
svg{ display:block; flex-shrink:0; }
:focus-visible{ outline:2px solid var(--brand-btn); outline-offset:2px; border-radius:6px; }
h1,h2,h3,h4{ font-family:var(--font-d); letter-spacing:-.01em; line-height:1.2; }
.mono{ font-variant-numeric:tabular-nums; }

/* ---------- layout ---------- */
.sidebar{ position:fixed; left:0; top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px); width:252px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; z-index:60; transition:transform .25s ease; }
.brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; font-family:var(--font-d); font-weight:800; font-size:19px; color:var(--text); }
.brand small{ display:block; font-weight:500; font-size:11px; color:var(--muted); font-family:var(--font-b); margin-top:-2px; }
.nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
.nav-label{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); padding:14px 10px 6px; }
.nav-item{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; color:var(--muted); font-weight:500; text-align:left; width:100%; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--brand-soft); color:var(--brand); font-weight:600; }
.nav-item .badge-n{ margin-left:auto; background:var(--coral); color:#fff; font-size:11px; font-weight:700; border-radius:999px; min-width:20px; height:20px; padding:0 6px; display:flex; align-items:center; justify-content:center; }
.trial-card{ margin-top:10px; border:1px solid var(--line); background:linear-gradient(160deg,var(--brand-soft),transparent); border-radius:14px; padding:14px; }
.trial-card b{ font-family:var(--font-d); font-size:13px; }
.trial-card p{ color:var(--muted); font-size:12px; margin:4px 0 10px; }
.bar{ height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
.bar>i{ display:block; height:100%; border-radius:99px; background:var(--green); }
.main{ margin-left:252px; min-height:100%; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:40; display:flex; align-items:center; gap:12px; padding:12px 28px; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.hamburger{ display:none; width:38px; height:38px; border-radius:10px; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--surface); }
.search{ position:relative; flex:1; max-width:380px; }
.search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--dim); }
.search input{ width:100%; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface); padding:0 12px 0 38px; }
.search input:focus{ outline:none; border-color:var(--brand-btn); box-shadow:0 0 0 3px var(--brand-soft); }
.top-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.demo-chip{ display:flex; align-items:center; gap:8px; height:38px; padding:0 6px 0 12px; border:1px dashed var(--line-strong); border-radius:10px; color:var(--muted); font-size:12px; background:var(--surface); }
.demo-chip button{ height:28px; padding:0 10px; border-radius:8px; background:var(--brand-soft); color:var(--brand); font-weight:600; display:flex; align-items:center; gap:6px; }
.demo-chip button:hover{ background:var(--brand-btn); color:#fff; }
.icon-btn{ position:relative; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted); }
.icon-btn:hover{ color:var(--text); border-color:var(--line-strong); }
.dot{ position:absolute; top:7px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--coral); border:2px solid var(--surface); }
.avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--brand-btn),var(--green)); color:#fff; font-weight:700; font-family:var(--font-d); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.user-btn{ display:flex; align-items:center; gap:9px; padding:3px 8px 3px 3px; border-radius:99px; border:1px solid var(--line); background:var(--surface); }
.user-btn span{ font-weight:600; font-size:13px; }
.dropdown{ position:absolute; right:0; top:calc(100% + 8px); min-width:260px; max-width:92vw; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:8px; z-index:70; display:none; }
.dropdown.open{ display:block; }
.dd-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; width:100%; text-align:left; color:var(--text); }
.dd-item:hover{ background:var(--surface-2); }
.dd-sep{ height:1px; background:var(--line); margin:6px 4px; }
.dd-title{ padding:8px 10px 6px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
.seg{ display:flex; gap:4px; padding:4px; background:var(--surface-2); border-radius:10px; margin:2px 4px 6px; }
.seg button{ flex:1; padding:6px 0; border-radius:7px; font-size:12px; font-weight:600; color:var(--muted); }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
.rel{ position:relative; }
.notif-item{ display:flex; gap:10px; padding:10px; border-radius:9px; }
.notif-item.unread{ background:var(--brand-soft); }
.notif-item .ni{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.content{ padding:26px 28px 60px; max-width:1320px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.page-head h1{ font-size:26px; font-weight:800; }
.page-head p{ color:var(--muted); margin-top:4px; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- ui kit ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 16px; border-radius:10px; font-weight:600; border:1px solid transparent; white-space:nowrap; transition:background .15s, transform .1s, border-color .15s; }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--brand-btn); color:#fff; }
.btn-primary:hover{ background:var(--brand-hover); }
.btn-green{ background:var(--green-btn); color:#fff; }
.btn-green:hover{ filter:brightness(1.07); }
.btn-ghost{ background:var(--surface); border-color:var(--line-strong); color:var(--text); }
.btn-ghost:hover{ border-color:var(--brand-btn); color:var(--brand); }
.btn-coral{ background:var(--coral-soft); color:var(--coral-ink); }
.btn-coral:hover{ background:var(--coral); color:#fff; }
.btn-sm{ height:30px; padding:0 11px; font-size:12.5px; border-radius:8px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
.card-pad{ padding:20px; }
.card h3{ font-size:15px; font-weight:700; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.sub{ color:var(--muted); font-size:12.5px; }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
.b-red{ background:var(--coral-soft); color:var(--coral-ink); }
.b-green{ background:var(--green-soft); color:var(--green-ink); }
.b-blue{ background:var(--brand-soft); color:var(--brand); }
.b-gray{ background:var(--surface-2); color:var(--muted); }
.b-amber{ background:var(--amber-soft); color:var(--amber-ink); }
.grid{ display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
.grid>*{ min-width:0; }
.g4{ grid-template-columns:repeat(4,1fr); }
.g2{ grid-template-columns:1fr 1fr; }
.g-main{ grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); align-items:start; }
.kpi{ padding:18px; }
.kpi .lab{ display:flex; align-items:center; gap:8px; color:var(--muted); font-weight:500; font-size:13px; }
.kpi .ico{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.kpi .val{ font-family:var(--font-d); font-size:28px; font-weight:800; margin:10px 0 2px; letter-spacing:-.02em; }
.kpi .note{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.banner{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:14px; margin-bottom:18px; flex-wrap:wrap; }
.banner.coral{ background:var(--coral-soft); border:1px solid color-mix(in srgb,var(--coral) 35%,transparent); }
.banner.blue{ background:var(--brand-soft); border:1px solid color-mix(in srgb,var(--brand-btn) 30%,transparent); }
.banner.green{ background:var(--green-soft); border:1px solid color-mix(in srgb,var(--green) 35%,transparent); }
.banner .bi{ width:38px; height:38px; border-radius:11px; background:var(--surface); display:flex; align-items:center; justify-content:center; }
.banner .bt{ flex:1; min-width:220px; }
.banner .bt b{ display:block; font-family:var(--font-d); }
.banner .bt span{ color:var(--muted); font-size:13px; }
.tablewrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface); }
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--text); }
td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr.clickable{ cursor:pointer; }
tbody tr.clickable:hover td{ background:var(--surface-2); }
td.num,th.num{ text-align:right; }
.cell-main{ font-weight:600; }
.cell-sub{ color:var(--muted); font-size:12.5px; }
.pills{ display:flex; gap:6px; flex-wrap:wrap; }
.pill{ height:32px; padding:0 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-weight:500; color:var(--muted); display:inline-flex; align-items:center; gap:7px; }
.pill.on{ background:var(--brand-btn); color:#fff; border-color:var(--brand-btn); }
.pill i{ font-style:normal; font-size:11.5px; opacity:.85; }
.toolbar{ display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--line); }
.empty{ text-align:center; padding:48px 20px; color:var(--muted); }
.empty .ei{ width:56px; height:56px; border-radius:50%; background:var(--green-soft); color:var(--green-ink); margin:0 auto 14px; display:flex; align-items:center; justify-content:center; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-weight:600; font-size:12.5px; }
.field input,.field select,.field textarea{ height:40px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); padding:0 12px; width:100%; }
.field textarea{ height:auto; min-height:120px; padding:10px 12px; line-height:1.5; resize:vertical; }
.field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--brand-btn); box-shadow:0 0 0 3px var(--brand-soft); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
.switch input{ position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2; width:100%; height:100%; }
.switch i{ position:absolute; inset:0; border-radius:99px; background:var(--line-strong); transition:background .2s; }
.switch i::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + i{ background:var(--green-btn); }
.switch input:checked + i::after{ transform:translateX(18px); }
.setting{ display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line); }
.setting:last-child{ border-bottom:none; }
.setting .st{ flex:1; }
.setting .st b{ display:block; font-weight:600; }
.setting .st span{ color:var(--muted); font-size:12.5px; }

/* ---------- overlays ---------- */
.overlay{ position:fixed; inset:0; background:rgba(8,13,26,.55); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--surface); border:1px solid var(--line); border-radius:18px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px -20px rgba(0,0,0,.45); }
.modal.wide{ max-width:760px; }
.modal-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px 6px; }
.modal-h h2{ font-size:19px; font-weight:800; }
.modal-b{ padding:10px 22px 6px; }
.modal-f{ display:flex; justify-content:flex-end; gap:8px; padding:14px 22px 20px; flex-wrap:wrap; }
.x{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
.x:hover{ background:var(--surface-2); color:var(--text); }
.drawer-bg{ position:fixed; inset:0; background:rgba(8,13,26,.45); z-index:90; display:flex; justify-content:flex-end; }
.drawer{ width:480px; max-width:100%; background:var(--surface); height:100%; overflow-y:auto; box-shadow:-20px 0 60px -20px rgba(0,0,0,.4); animation:slide .22s ease; }
@keyframes slide{ from{ transform:translateX(30px); opacity:.5; } to{ transform:none; opacity:1; } }
.drawer-h{ padding:20px 22px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
.drawer-b{ padding:18px 22px 30px; }
.kv{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin:14px 0 18px; }
.kv div span{ display:block; font-size:12px; color:var(--muted); }
.kv div b{ font-weight:600; }
.copybox{ display:flex; gap:8px; align-items:center; padding:8px 8px 8px 12px; border:1px dashed var(--line-strong); border-radius:10px; background:var(--surface-2); }
.copybox code{ flex:1; font-size:12.5px; color:var(--brand); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.timeline{ position:relative; margin-top:6px; padding-left:22px; }
.timeline::before{ content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl{ position:relative; padding:0 0 16px; }
.tl::before{ content:""; position:absolute; left:-20px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); }
.tl.green::before{ border-color:var(--green); background:var(--green); }
.tl.blue::before{ border-color:var(--brand-btn); }
.tl.coral::before{ border-color:var(--coral); }
.tl b{ font-weight:600; }
.tl small{ display:block; color:var(--muted); }
.toast-wrap{ position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast{ background:#0F172A; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:0 14px 40px -10px rgba(0,0,0,.5); display:flex; gap:10px; align-items:center; max-width:380px; animation:pop .25s ease; font-size:13.5px; }
.toast.ok svg{ color:#34D399; }
.toast.warn svg{ color:#FBBF24; }
@keyframes pop{ from{ transform:translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }

/* ---------- specific ---------- */
.chart-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted); }
.chart-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.aging-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.aging-row .al{ width:64px; color:var(--muted); font-size:12.5px; }
.aging-row .ab{ flex:1; height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.aging-row .ab i{ display:block; height:100%; background:var(--coral); border-radius:99px; transition:width .4s; }
.aging-row .av{ width:80px; text-align:right; font-weight:600; font-size:13px; }
.check{ display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.check:last-child{ border-bottom:none; }
.check .cb{ width:22px; height:22px; border-radius:50%; border:2px solid var(--line-strong); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; }
.check.done .cb{ background:var(--green); border-color:var(--green); }
.check.done b{ color:var(--muted); text-decoration:line-through; }
.check b{ display:block; font-weight:600; }
.check span{ color:var(--muted); font-size:12.5px; }
.feed{ display:flex; flex-direction:column; }
.feed-item{ display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
.feed-item:last-child{ border-bottom:none; }
.feed-item .fi{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.feed-item small{ color:var(--dim); display:block; }
.ch{ display:inline-flex; align-items:center; gap:6px; font-weight:500; }
.ch-ico{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background:var(--brand-soft); color:var(--brand); }
.scn{ display:flex; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:12px; width:100%; text-align:left; margin-bottom:8px; background:var(--surface); }
.scn.on{ border-color:var(--brand-btn); background:var(--brand-soft); }
.scn .sn{ flex:1; }
.scn .sn b{ display:block; font-weight:600; }
.steps{ display:flex; flex-direction:column; gap:10px; }

button.badge{ border:none; font-family:inherit; white-space:normal; text-align:left; line-height:1.3; max-width:100%; }
.relgrid{ grid-template-columns:minmax(0,280px) minmax(0,1fr); align-items:start; }

.gt{ flex:1; line-height:1.65; }
a.btn{ text-decoration:none; }

.scrim{ display:none; }

}

  .kv{ grid-template-columns:1fr; }

/* ---------- engine: one reminder at a time, sequential, min 3 days between ---------- */
function runEngine(){
  let created=0;
  S.invoices.forEach(i=>{
    if(i.status!=='overdue' || i.paused) return;
    if(i.reminders.some(r=>r.status==='queued'||r.status==='ready')) return;
    const sc = scenarioFor(i);
    const last = i.reminders.filter(r=>r.status==='sent').reduce((m,r)=>Math.max(m,r.day),-9999);
    if(last>-9999 && S.day-last<3) return;
    const o = od(i);
    let cand=-1;
    sc.steps.forEach((st,idx)=>{ if(st.on && st.delay<=o && idx>i.lastStep) cand=idx; });
    if(cand<0) return;
    const st = sc.steps[cand];
    const ch = canUse(st.channel) ? st.channel : 'email';
    const m = buildMessage(i,ch,st.tone,ch===st.channel?st.custom:'');
    const r = {id:uid(),step:cand,channel:ch,tone:st.tone,subject:m.subject,text:m.text,status:'queued',day:S.day,fallback:ch!==st.channel};
    if(S.manualValidation){
      i.reminders.push(r); created++;
    } else {
      r.status='sent'; i.reminders.push(r); i.lastStep=cand;
      i.events.push({day:S.day,tone:'blue',t:`Relance envoyée par ${CH[ch].label}`,s:`Envoi automatique · ${TONES[st.tone]}`});
      logActivity('blue',CH[ch].icon,`Relance envoyée automatiquement à ${client$(i.client)?.contact||i.client} (${CH[ch].label}) — facture n°${i.id}`);
      S.flags.first=true;
    }
  });
  if(created>0){
    notify('coral','alert',`${created} ${plural(created,'relance est prête','relances sont prêtes')} à être ${plural(created,'validée','validées')}`,'validation');
  }
  return created;
}
function sendReminder(i,r,mode){
  r.status='sent'; r.day=S.day; r.mode=mode; delete r.error;
  i.lastStep = Math.max(i.lastStep, r.step!=null ? r.step : -1);
  const c = client$(i.client), who = c ? c.contact : i.client;
  const lab = {real:'Envoi réel',sim:'Envoi simulé (aucun message réellement envoyé)',wa:'Ouvert dans WhatsApp'}[mode] || '';
  const title = (mode==='sim' ? (r.channel==='email'?'E-mail simulé':'WhatsApp simulé') : `Relance envoyée par ${CH[r.channel].label}`);
  i.events.push({day:S.day,tone:'blue',t:title,s:`${lab} · ${TONES[r.tone]||'Message personnalisé'} · à ${who}`});
  logActivity('blue',CH[r.channel].icon,`${title} — ${who}, facture n°${i.id} (${eur(i.amount)})${mode==='sim'?' — simulation':''}`);
  S.flags.first=true;
}
/* Envoie (vraiment) un e-mail, prépare un WhatsApp, ou simule pour les clients fictifs */
async function deliver(i,r){
  const c = client$(i.client);
  if(r.channel==='whatsapp'){
    if(!c || !normPhone(c.phone)){ toast('Numéro WhatsApp manquant ou invalide — corrigez-le dans Clients › Modifier.','warn'); return 'error'; }
    if(isFictionalPhone(c.phone)){ sendReminder(i,r,'sim'); return 'sent'; }
    r.status='ready'; return 'ready';
  }
  if(!c || !/^\S+@\S+\.\S+$/.test(c.email||'')){ toast('Adresse e-mail manquante ou invalide — corrigez-la dans Clients › Modifier.','warn'); return 'error'; }
  if(emailReady() && !isFictionalEmail(c.email)){
    try{ await emailjsSend(c.email,c.contact,r.subject,r.text,{invoice_number:i.id,amount:eur(i.amount),pay_link:payLink(i)}); }
    catch(e){ r.error=e.message; toast('Échec de l’envoi e-mail : '+e.message+'.','warn'); return 'error'; }
    sendReminder(i,r,'real'); return 'sent';
  }
  sendReminder(i,r,'sim'); return 'sent';
}
function sentToast(i,r){
  const c = client$(i.client);
  if(r.channel==='email'){
    if(r.mode==='real') return `E-mail envoyé à ${c.email}.`;
    if(c && isFictionalEmail(c.email) && emailReady()) return 'Client fictif de la démo : e-mail simulé (aucun envoi réel à une adresse fictive).';
    return 'E-mail simulé — activez l’envoi réel dans Intégrations › E-mail.';
  }
  return r.mode==='sim' ? 'Numéro fictif de la démo : message WhatsApp simulé.' : 'Message WhatsApp ouvert : appuyez sur Envoyer dans WhatsApp.';
}
function markPaid(i,attributed){
  const lastSent = i.reminders.filter(r=>r.status==='sent').slice(-1)[0];
  i.reminders.forEach(r=>{ if(r.status==='queued'||r.status==='ready') r.status='cancelled'; });

function cashChart(){
  const n=8, vals=[], rel=[];
  for(let w=0;w<n;w++){ vals.push(S.hist[w]); rel.push(S.histR[w]); }
  S.invoices.filter(i=>i.live && i.status==='paid').forEach(i=>{
    const w = n-1-Math.min(n-1,Math.floor((S.day-i.paidDay)/7));
    vals[w]+=i.amount; if(i.paidVia) rel[w]+=i.amount;
  });
  const max = Math.max(1000,...vals)*1.15;
  const W=620,H=230,L=44,B=28,T=10,bw=44, gap=(W-L-10-n*bw)/(n-1);
  let g='';
  for(let k=0;k<=4;k++){
    const y = T+(H-T-B)*(1-k/4), v = Math.round(max*k/4/100)*100;
    g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--dim)">${v>=1000?(v/1000).toFixed(1).replace('.0','')+'k':v}</text>`;
  }
  let bars='';
  vals.forEach((v,w)=>{
    const x=L+w*(bw+gap), h=(H-T-B)*v/max, hr=(H-T-B)*rel[w]/max, y=H-B-h;
    const lab = w===n-1?'Cette sem.':'S-'+(n-1-w);
    bars+=`<g><title>${lab} — ${eur(v)} encaissés${rel[w]?`, dont ${eur(rel[w])} grâce aux relances`:''}</title>
      <rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="6" fill="var(--brand-btn)" opacity=".88"/>
      ${rel[w]>0?`<rect x="${x}" y="${H-B-hr}" width="${bw}" height="${hr}" rx="${hr>8?6:3}" fill="var(--green)"/>`:''}
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--dim)">${lab}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Encaissements par semaine">${g}${bars}</svg>`;
}

/* ----------------------- Invoices ----------------------- */
function filteredInvoices(){
  const f = S.f; let a = S.invoices.slice();
  if(f.status==='overdue') a=a.filter(i=>i.status==='overdue');
  else if(f.status==='upcoming') a=a.filter(i=>i.status==='upcoming');
  else if(f.status==='paid') a=a.filter(i=>i.status==='paid');
  else if(f.status==='collection') a=a.filter(i=>i.status==='collection');
  if(f.client) a=a.filter(i=>i.client===f.client);
  if(f.q){ const q=f.q.toLowerCase(); a=a.filter(i=>(i.client+' '+i.id+' '+(client$(i.client)?.contact||'')+' '+i.amount).toLowerCase().includes(q)); }
  const k=f.sort, d=f.dir;
  a.sort((x,y)=>{
    let r=0;
    if(k==='due') r=x.due-y.due; else if(k==='amount') r=x.amount-y.amount; else if(k==='client') r=x.client.localeCompare(y.client); else if(k==='id') r=Number(x.id)-Number(y.id);
    return r*d;
  });
  return a;
}

  const s = statusOf(i); const last = i.reminders.filter(r=>r.status==='sent').slice(-1)[0];
  const c = client$(i.client);

/* ----------------------- Clients ----------------------- */
function clientStats(c){
  const inv = S.invoices.filter(i=>i.client===c.name);
  const paid = inv.filter(i=>i.status==='paid'), over = inv.filter(i=>i.status==='overdue'||i.status==='collection');
  const settled = paid.length+over.length;
  const onTime = paid.filter(i=>i.paidDay<=i.due).length;
  const score = settled ? Math.round(onTime/settled*100) : 100;
  const avg = paid.length ? Math.round(paid.reduce((s,i)=>s+(i.paidDay-i.issued),0)/paid.length) : null;
  const risk = over.some(i=>od(i)>15||i.status==='collection') ? 'risk' : (over.length ? 'watch' : 'ok');
  return {n:inv.length, out:over.reduce((s,i)=>s+i.amount,0), score, avg, risk};
}

/* ---------- compose modal ---------- */
let CM = null;
function openCompose(id){
  const i = inv$(id); if(!i) return;
  const sc = scenarioFor(i);
  const stepIdx = Math.max(0, Math.min(sc.steps.length-1, sc.steps.reduce((m,s,ix)=> (s.delay<=od(i)?ix:m),0)));
  const st = sc.steps[stepIdx] || {channel:'email',tone:'friendly'};
  CM = {id:i.id,channel:canUse(st.channel)?st.channel:'email',tone:st.tone,edited:false};

}

    <div class="reassure" style="margin-bottom:6px">${ic('shield',18)}<div style="flex:1">${CM.channel==='email'?'En cliquant sur « Envoyer », vous validez ce message : il part immédiatement.':'Le message s’ouvrira dans WhatsApp, prêt à envoyer d’un clic.'}</div>${CM.channel==='email'?`<div>${emailChip()}</div>`:''}</div></div>

/* ---------- mise en demeure ---------- */
function demeureText(i){
  const c = client$(i.client);
  const sent = i.reminders.filter(r=>r.status==='sent').map(r=>fmtDM(r.day));
  return `${S.user.company}\n${meName()}\n\nÀ l’attention de ${i.client}${c?` — ${c.contact}`:''}\n\nEnvoyée par e-mail\nFait le ${fmtDL(S.day)}\n\nObjet : Mise en demeure de payer — facture n°${i.id}\n\nMadame, Monsieur,\n\nMalgré ${sent.length?`mes relances des ${sent.join(', ')}`:'mes demandes de règlement'}, la facture n°${i.id} d’un montant de ${eur(i.amount)}, émise le ${fmtDM(i.issued)} et échue le ${fmtDM(i.due)}, demeure impayée à ce jour (${od(i)} jours de retard).\n\nPar la présente, je vous mets en demeure de régler la somme de ${eur(i.amount)} dans un délai de 8 jours à compter de la réception de ce courrier.\n\nJe vous rappelle que, conformément aux articles L. 441-10 et D. 441-5 du Code de commerce, tout retard de paiement entraîne de plein droit des pénalités de retard ainsi qu’une indemnité forfaitaire de 40 € pour frais de recouvrement.\n\nÀ défaut de règlement dans ce délai, je transmettrai le dossier à un partenaire de recouvrement et me réserve le droit d’engager toute action utile pour obtenir le paiement de ma créance.\n\nVeuillez agréer, Madame, Monsieur, l’expression de mes salutations distinguées.\n\n${meName()}`;
}
function openDemeure(id){
  const i = inv$(id); if(!i) return;

    <div class="sub" style="margin-bottom:8px">À : ${esc(c?c.email:'')} · Objet : Mise en demeure de payer — facture n°${i.id}</div>

function copyText(v){
  const done = () => toast('Copié dans le presse-papiers.');
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(v).then(done,()=>fallbackCopy(v,done)); return; } }catch(e){}
  fallbackCopy(v,done);
}
function fallbackCopy(v,done){ const ta=document.createElement('textarea'); ta.value=v; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); done(); }

function doRealTest(){

  S.clients.push(c);

function parseDate(s){
  s=String(s||'').trim(); let d;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){ const [dd,mm,yy]=s.split('/').map(Number); d=new Date(yy,mm-1,dd,12); }
  else if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [yy,mm,dd]=s.split('-').map(Number); d=new Date(yy,mm-1,dd,12); }
  else return null;
  return Math.round((d-BASE)/86400000);
}
function addInvoice(o){
  let c = S.clients.find(x=>x.name.toLowerCase()===o.client.toLowerCase());
  if(!c){ c={id:'c'+(S.clients.length+1)+Date.now()%1000,name:o.client,contact:o.client,email:o.email||'',phone:o.phone||'',scenario:null}; S.clients.push(c); }
  else { if(o.email) c.email=o.email; if(o.phone) c.phone=o.phone; }
  const nextId = String(o.id && !inv$(o.id) ? o.id : Math.max(...S.invoices.map(i=>+i.id||0))+1);
  const i = {id:nextId,client:c.name,amount:o.amount,issued:o.issued,due:o.due,status:o.due<S.day?'overdue':'upcoming',source:o.source||'Import CSV',reminders:[],events:[{day:o.issued,tone:'blue',t:'Facture émise',s:'Importée dans PayRelance'}],paused:false,lastStep:-1,live:false};
  S.invoices.push(i); return i;
}

  logActivity('blue','upload',`${n} ${plural(n,'facture importée','factures importées')} (${srcLabel})${late?` — ${late} en retard détectée${late>1?'s':''}`:''}`);
  if(late) notify('coral','alert',`${late} ${plural(late,'facture en retard détectée','factures en retard détectées')} — relances prêtes`,'validation');
  closeModal(); render(); toast(`${n} ${plural(n,'facture importée','factures importées')}${late?` · ${late} en retard détectée${late>1?'s':''}`:''}${created?` · ${created} ${plural(created,'relance prête','relances prêtes')} à valider`:''}.`);
}
function importCSV(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ toast('Collez ou chargez au moins une ligne.','warn'); return; }
  let n=0,late=0,bad=0;
  lines.forEach(l=>{
    const cells = l.split(/[;,\t]/).map(x=>x.trim());
    if(cells.length>=5 && isNaN(Number(cells[0])) && isNaN(Number(String(cells[3]).replace(',','.')))) return; // en-tête
    if(cells.length<5) { bad++; return; }
    const amount = Number(String(cells[3]).replace(/\s/g,'').replace(',','.')); const due = parseDate(cells[4]);
    if(!amount || due==null){ bad++; return; }
    const i = addInvoice({id:cells[0],client:cells[1],email:cells[2],amount,issued:due-30,due,source:'Import CSV'});
    n++; if(i.status==='overdue') late++;
  });
  if(!n){ toast('Aucune ligne valide. Vérifiez le format : numero;client;email;montant;echeance','warn'); return; }
  afterImport(n,late,'CSV'+(bad?`, ${bad} ligne(s) ignorée(s)`:''));
}
function importManual(){
  const client=$('#m-client').value.trim(), amount=Number($('#m-amount').value), mail=$('#m-mail').value.trim(), phone=$('#m-phone').value.trim();
  const issued=parseDate($('#m-issued').value), due=parseDate($('#m-due').value);
  if(!client||!amount||issued==null||due==null){ toast('Renseignez au moins le client, le montant et les dates.','warn'); return; }
  const i = addInvoice({client,email:mail,phone,amount,issued,due,source:'Saisie manuelle'});
  afterImport(1,i.status==='overdue'?1:0,'saisie manuelle');
}

/* ---------- onboarding tour ---------- */
const TOUR = [
  {i:'zap',t:'Bienvenue sur PayRelance',d:'Ne courez plus après votre argent : PayRelance détecte vos factures en retard et relance vos clients à votre place, avec le bon ton et un lien de paiement direct.'},
  {i:'shield',t:'Vous gardez la main',d:'Aucun e-mail ni message WhatsApp ne sera envoyé à vos clients sans votre validation manuelle préalable. Vous relisez, modifiez ou ignorez chaque relance.'},
  {i:'send',t:'Votre première relance en 1 clic',d:'Nous avons déjà repéré 3 factures en retard dans votre fichier. Allez dans « À valider » pour envoyer vos premières relances en un clic — ou testez en conditions réelles depuis le tableau de bord pour recevoir une vraie relance.'}
];
function startTour(n){
  const s = TOUR[n]; const last = n===TOUR.length-1;
  openModal(`<div class="modal-b" style="padding:28px 28px 8px;text-align:center"><div class="stepper">${TOUR.map((_,k)=>`<i class="${k<=n?'on':''}"></i>`).join('')}</div><div style="width:60px;height:60px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:6px auto 16px">${ic(s.i,28)}</div><h2 style="font-size:22px;margin-bottom:8px">${s.t}</h2><p style="color:var(--muted)">${s.d}</p></div><div class="modal-f" style="justify-content:space-between;padding:18px 28px 24px"><button class="btn btn-ghost" data-a="tour-end">Passer</button>${last?`<button class="btn btn-green" data-a="tour-end-go">Voir mes relances</button>`:`<button class="btn btn-primary" data-a="tour-next" data-id="${n+1}">Suivant</button>`}</div>`);
}
A['tour-end-go'] = ()=>{ S.flags.tour=true; closeModal(); S.view='validation'; render(); };

/* =========================================================
   Inputs / change / global events
   ========================================================= */
const I = {
  search(t){ S.f.q=t.value; if(S.view!=='factures'){ S.view='factures'; render(); const g=$('#gsearch'); g.focus(); } else { $('#invtable').innerHTML=invTableInner(); } },
  'step-delay'(t){ const st=curScenario().steps[+t.dataset.id]; st.delay=Math.max(0,Math.min(90,parseInt(t.value||'0',10)||0)); const pb=$('#prev-box'); if(pb && +t.dataset.id===S.edit.step) pb.innerHTML=stepPreview(); },
  'step-custom'(t){ curScenario().steps[S.edit.step].custom=t.value; $('#prev-box').innerHTML=stepPreview(); },
  'cm-edit'(){ if(CM) CM.edited=true; },
  'cc-n'(t){ const v=t.value.replace(/\D/g,'').slice(0,16); t.value=v.replace(/(.{4})/g,'$1 ').trim(); }
};
const C = {
  manual(t){
    if(!t.checked){
      t.checked=true;
      openModal(`${mh('Désactiver la validation manuelle ?')}<div class="modal-b"><div class="banner" style="background:var(--amber-soft);border:1px solid var(--line)"><div class="bt"><b>Attention</b><span>Les relances partiront automatiquement chez vos clients, sans que vous les ayez relues. Nous vous conseillons de garder la validation manuelle pour vos clients importants.</span></div></div></div><div class="modal-f"><button class="btn btn-ghost" data-a="close-modal">Garder la validation</button><button class="btn btn-coral" data-a="manual-off">Désactiver</button></div>`);
    } else { S.manualValidation=true; render(); }
  },
  paylink(t){ S.payLink=t.checked; render(); },
  biz(t){ S.bizDays=t.checked; },
  window(t){ S.window=t.value; },
  'prev-inv'(t){ S.edit.prev=t.value; $('#prev-box').innerHTML=stepPreview(); },
  'step-channel'(t){ const st=curScenario().steps[+t.dataset.id]; if(!canUse(t.value)) toast('Ce canal nécessite l’offre Pro — l’e-mail sera utilisé en attendant.','warn'); st.channel=t.value; st.custom=''; S.edit.step=+t.dataset.id; render(); },
  'step-tone'(t){ const st=curScenario().steps[+t.dataset.id]; st.tone=t.value; st.custom=''; S.edit.step=+t.dataset.id; render(); },
  'step-on'(t){ curScenario().steps[+t.dataset.id].on=t.checked; render(); },
  'client-scn'(t){ const c=S.clients.find(x=>x.id===t.dataset.id); c.scenario=t.value||null; toast(`Scénario mis à jour pour ${c.name}.`); },
  'pref-weekly'(t){ S.weeklyRecap=t.checked; },
  'pref-pay'(t){ S.payAlerts=t.checked; },
  'csv-file'(t){ const f=t.files&&t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const ta=$('#csv-txt'); if(ta) ta.value=String(r.result||''); }; r.readAsText(f); }
};
A['manual-off'] = ()=>{ S.manualValidation=false; closeModal(); render(); toast('Validation manuelle désactivée.','warn'); };

document.addEventListener('click', e=>{
  const bg = e.target.closest('[data-bg]');
  if(bg && e.target===bg){ if(bg.dataset.bg==='modal') closeModal(); else { S._drawerInv=null; closeDrawer(); } return; }
  if(!e.target.closest('.rel')){ if(S.userMenu||S.notifMenu){ S.userMenu=false; S.notifMenu=false; renderMenus(); } }
  const t = e.target.closest('[data-a]'); if(!t) return;
  const fn = A[t.dataset.a]; if(fn) fn(t,e);
});
document.addEventListener('input', e=>{ const t=e.target.closest('[data-i]'); if(t && I[t.dataset.i]) I[t.dataset.i](t,e); });
document.addEventListener('change', e=>{ const t=e.target.closest('[data-c]'); if(t && C[t.dataset.c]) C[t.dataset.c](t,e); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal').innerHTML) closeModal(); else if($('#drawer').innerHTML){ S._drawerInv=null; closeDrawer(); } else closeMenu(); } });

/* ---------- theme ---------- */
function applyTheme(){
  const r = document.documentElement;
  if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme);
  try{ localStorage.setItem('payrelance-theme',S.theme); }catch(e){}
}

/* ---------- init ---------- */
S = seed();
try{ const th=localStorage.getItem('payrelance-theme'); if(th==='light'||th==='dark'||th==='auto') S.theme=th; }catch(e){}
applyTheme();
try{
  if(location.hash.indexOf('#cfg=')===0){
    const o = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5)))));
    if(o.emailjs) Object.assign(CFG.emailjs,o.emailjs);
    if(o.publicUrl!=null) CFG.publicUrl=o.publicUrl;
    if(o.payTpl!=null) CFG.payTpl=o.payTpl;
    saveCfg(); S._cfgLoaded=true;
    history.replaceState(null,'',location.pathname+location.search);
  }
}catch(e){}
const PAYMODE = location.hash.indexOf('#/pay')===0;
window.addEventListener('hashchange',()=>{ if(PAYMODE || location.hash.indexOf('#/pay')===0) location.reload(); });
if(PAYMODE){ renderPayPage(); return; }
try{ const bc=new BroadcastChannel('payrelance'); bc.onmessage = e => onPaid(e.data); }catch(e){}
window.addEventListener('storage',e=>{ if(e.key==='payrelance-paid' && e.newValue){ try{ onPaid(JSON.parse(e.newValue)); }catch(_){} } });
runEngine();
render();
if(S._cfgLoaded) setTimeout(()=>toast('Configuration d’envoi chargée : l’envoi e-mail réel est actif.'),700);
setTimeout(()=>{ if(!S.flags.tour && !$('#modal').innerHTML) startTour(0); },500);
window.__PR = { get S(){ return S; }, A };
})();
